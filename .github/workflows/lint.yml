name: Lint

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  RUFF_VERSION: "0.16.4"

jobs:
  ruff:
    name: Lint Python
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ruff
        run: pip install "ruff==${RUFF_VERSION}"
      - name: unspecified-encoding (PLW1514)
        run: |
          ruff check \
            --preview \
            --select PLW1514 \
            --exclude .venv \
            --exclude dist \
            --output-format=github \
            .

      # Needs pyyaml, which is why it runs after ruff rather than in its own job.
      - name: Install check dependencies
        run: pip install "pyyaml~=6.0"

      # Check pinned install in CI
      - name: Workflow installs must be pinned
        run: python scripts/check_pinned_installs.py
